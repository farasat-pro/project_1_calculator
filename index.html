<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    
    <div class="main-container">
        <div id="display-area"></div>

        <div class="buttons-grid">
            <button class="btn action-btn" id="clear-btn">C</button>
            <button class="btn op-btn">%</button>
            <button class="btn op-btn">/</button>
            <button class="btn op-btn">*</button>

            <button class="btn num-btn">7</button>
            <button class="btn num-btn">8</button>
            <button class="btn num-btn">9</button>
            <button class="btn op-btn">-</button>

            <button class="btn num-btn">4</button>
            <button class="btn num-btn">5</button>
            <button class="btn num-btn">6</button>
            <button class="btn op-btn">+</button>
            
            <button class="btn num-btn">1</button>
            <button class="btn nun-btn">2</button>
            <button class="btn num-btn">3</button>
            <button class="btn equal-btn" id="equal-btn">=</button>

            <button class="btn num-btn zero-btn">0</button>
            <button class="btn num-btn">.</button>

        </div>
    </div>
</body>
</html>
