<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" d ></script>
</head>
<body>
    <div>
        <h1>Calculator</h1>
        <fieldset bod> 

            <div id="screen" >
                
            </div>

            <div id="all_btn">
                <button class="btn">1</button>
                <button class="btn">2</button>
                <button class="btn">3</button>
                <button class="btn">4</button>
                <button class="btn">5</button>
                <button class="btn">6</button>
                <button class="btn">7</button>
                <button class="btn">8</button>
                <button class="btn">9</button>
                <button class="btn">0</button>
    
                <button  class="btn"  id="btn_plus" onclick="check_operation(1)" >+</button>
                <button class="btn"  id="btn_minus" onclick="check_operation(2)" >-</button>
                <button  class="btn" id="btn_divide" onclick="check_operation(3)" >/</button>
                <button class="btn"  id="btn_multiply" onclick="check_operation(4)" >*</button>
                <button  class="btn" id="btn_mode" onclick="check_operation(5)" >%</button>
    
                <button class="btn" id="click" onclick="calculate()" >=</button>

            </div>
        </fieldset>
    </div>
</body>
</html>
